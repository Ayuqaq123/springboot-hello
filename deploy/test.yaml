---
kind: Service
apiVersion: v1
metadata:
  name: spring-boot-helloworld
  namespace: test
  labels:
    app: spring-boot-helloworld
spec:
  #type: NodePort
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8888
      nodePort: 30666
  selector:
    app: spring-boot-helloworld
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: spring-boot-helloworld
  namespace: test
  labels:
    app: spring-boot-helloworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-helloworld
  template:
    metadata:
      name: spring-boot-helloworld
      labels:
        app: spring-boot-helloworld
    spec:
      containers:
      - name: spring-boot-helloworld
        image: 'artifact.nc.rdcloud.4c.hq.cmcc:80/csq-docker/spring-boot-helloworld:main-ad249f3a1d1e0aa958299a5190c2ba72dbd6bedf'
        ports:
        - name: http
          containerPort: 80
          protocol: TCP